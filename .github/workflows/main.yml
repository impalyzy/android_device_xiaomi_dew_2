name: Build OrangeFox Recovery (HyperOS 2 / A14)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Recovery for dew
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Maximize Build Disk Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Clean and Set Up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libreadline-dev libsqlite3-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync OrangeFox Source (fox_14.0)
      run: |
        mkdir -p ~/OrangeFox
        cd ~/OrangeFox
        repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_14.0 --depth=1
        repo sync -c --no-tags --no-clone-bundle -j$(nproc)

    - name: Copy Device Tree
      run: |
        mkdir -p ~/OrangeFox/device/xiaomi/dew
        cp -r $GITHUB_WORKSPACE/* ~/OrangeFox/device/xiaomi/dew/

    - name: Compile Recovery
      run: |
        cd ~/OrangeFox
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_TYPE="Unofficial"
        export OF_MAINTAINER="impalyzy"
        lunch fox_dew-eng
        mka recoveryimage -j$(nproc)

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Recovery-dew-A14
        path: |
          ~/OrangeFox/out/target/product/dew/*.img
          ~/OrangeFox/out/target/product/dew/*.zip
